  <title id="title">X to PDF</title>
  <desc id="desc">An elegant dark serif X above PDF, framed in gold on warm ivory.</desc>
  <rect width="1024" height="1024" rx="232" fill="#f7f2e8"/>
  <rect x="66" y="66" width="892" height="892" rx="186" fill="none" stroke="#c9b59a" stroke-width="8"/>
  <rect x="112" y="112" width="800" height="800" rx="148" fill="none" stroke="#e3d7c7" stroke-width="2"/>
  <text x="512" y="604" text-anchor="middle" fill="#1f1a17" font-family="'Liberation Serif', 'Times New Roman', serif" font-size="540">X</text>
  <line x1="290" y1="674" x2="734" y2="674" stroke="#b89b72" stroke-width="6" stroke-linecap="round"/>
  <text x="523" y="816" text-anchor="middle" fill="#7d6956" font-family="'Liberation Serif', 'Times New Roman', serif" font-size="124" letter-spacing="22">PDF</text>
